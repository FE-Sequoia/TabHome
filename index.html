<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabHome 大宝标签管理器</title>
    <link rel="icon" href="icons/icon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- 左侧边栏：分组列表 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1 class="app-title">标签分组</h1>
                <button class="btn-icon" id="addCategoryBtn" title="添加分组">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M8 2V14M2 8H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <nav class="category-list" id="categoryList">
                <!-- 分组列表通过 JS 动态生成 -->
            </nav>
            <div class="sidebar-footer">
                <button class="btn-text" id="importBtn">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <path d="M8 2V10M8 10L5 7M8 10L11 7M2 12H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    导入
                </button>
                <button class="btn-text" id="exportBtn">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <path d="M8 14V6M8 6L5 9M8 6L11 9M2 4H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    导出
                </button>
            </div>
        </aside>

        <!-- 右侧主内容区 -->
        <main class="main-content">
            <!-- 顶部标题栏 -->
            <header class="content-header">
                <div class="header-left">
                    <h2 class="current-category-name" id="currentCategoryName">全部标签</h2>
                    <span class="tab-count" id="tabCount">0 个标签</span>
                </div>
                <div class="header-right">
                    <div class="search-box">
                        <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M11 11L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                        <input type="text" placeholder="搜索标签..." id="searchInput">
                    </div>
                    <button class="btn-primary" id="addTabBtn">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                            <path d="M8 2V14M2 8H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                        添加标签
                    </button>
                </div>
            </header>

            <!-- 标签卡片网格 -->
            <div class="tabs-grid" id="tabsGrid">
                <!-- 标签卡片通过 JS 动态生成 -->
            </div>

            <!-- 空状态 -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-icon">
                    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                        <rect x="8" y="12" width="32" height="28" rx="4" stroke="#C7C7CC" stroke-width="2"/>
                        <path d="M8 20H40" stroke="#C7C7CC" stroke-width="2"/>
                        <circle cx="16" cy="16" r="2" fill="#C7C7CC"/>
                        <circle cx="24" cy="16" r="2" fill="#C7C7CC"/>
                    </svg>
                </div>
                <p class="empty-title">暂无标签</p>
                <p class="empty-desc">点击右上角"添加标签"按钮创建新标签</p>
            </div>
        </main>
    </div>

    <!-- 分组右键菜单 -->
    <div class="context-menu" id="categoryContextMenu">
        <button class="context-item" data-action="rename">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                <path d="M8 2H4C2.89543 2 2 2.89543 2 4V12C2 13.1046 2.89543 14 4 14H12C13.1046 14 14 13.1046 14 12V8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M12 2L14 4L8 10H6V8L12 2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            重命名
        </button>
        <button class="context-item" data-action="moveUp">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                <path d="M8 12V4M8 4L4 8M8 4L12 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            上移
        </button>
        <button class="context-item" data-action="moveDown">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                <path d="M8 4V12M8 12L4 8M8 12L12 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            下移
        </button>
        <div class="context-divider"></div>
        <button class="context-item danger" data-action="delete">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                <path d="M2 4H14M12 4V13C12 13.5523 11.5523 14 11 14H5C4.44772 14 4 13.5523 4 13V4M6 4V3C6 2.44772 6.44772 2 7 2H9C9.55228 2 10 2.44772 10 3V4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            删除
        </button>
    </div>

    <!-- 添加/编辑标签对话框 -->
    <div class="modal" id="tabModal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="tabModalTitle">添加标签</h3>
                <button class="modal-close" id="tabModalClose">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M3 3L13 13M13 3L3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <form class="modal-body" id="tabForm">
                <div class="form-group">
                    <label class="form-label" for="tabName">名称</label>
                    <input type="text" class="form-input" id="tabName" placeholder="例如：Google" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="tabUrl">网址</label>
                    <input type="url" class="form-input" id="tabUrl" placeholder="https://..." required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="tabIcon">图标 URL（可选）</label>
                    <input type="url" class="form-input" id="tabIcon" placeholder="https://.../favicon.ico">
                </div>
                <div class="form-group">
                    <label class="form-label" for="tabDescription">描述（可选）</label>
                    <input type="text" class="form-input" id="tabDescription" placeholder="例如：搜索引擎，用于搜索网页内容" maxlength="100">
                </div>
                <div class="form-group">
                    <label class="form-label" for="tabCategory">分组</label>
                    <select class="form-select" id="tabCategory" required></select>
                </div>
            </form>
            <div class="modal-footer">
                <button class="btn-secondary" id="tabModalCancel">取消</button>
                <button class="btn-primary" id="tabModalSave">保存</button>
            </div>
        </div>
    </div>

    <!-- 添加/编辑分组对话框 -->
    <div class="modal" id="categoryModal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="categoryModalTitle">添加分组</h3>
                <button class="modal-close" id="categoryModalClose">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M3 3L13 13M13 3L3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <form class="modal-body" id="categoryForm">
                <div class="form-group">
                    <label class="form-label" for="categoryName">分组名称</label>
                    <input type="text" class="form-input" id="categoryName" placeholder="例如：常用工具" required>
                </div>
            </form>
            <div class="modal-footer">
                <button class="btn-secondary" id="categoryModalCancel">取消</button>
                <button class="btn-primary" id="categoryModalSave">保存</button>
            </div>
        </div>
    </div>

    <!-- 确认对话框 -->
    <div class="modal" id="confirmModal">
        <div class="modal-overlay"></div>
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h3 class="modal-title">确认操作</h3>
            </div>
            <div class="modal-body">
                <p class="confirm-message" id="confirmMessage">确定要执行此操作吗？</p>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="confirmCancel">取消</button>
                <button class="btn-danger" id="confirmOk">确认</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
